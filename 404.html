<!doctype html>
<html lang="en">
  <!-- Vercel serves this for any missing URL, at any depth, so paths here are root-absolute (unlike the other pages). -->
  <head>
    <meta charset="UTF-8" />
    <script src="/assets/js/theme.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found - Timetable Manager</title>
    <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .lost {
        --c: var(--s-slate);
      }

      .lost .label {
        margin-top: 8vh;
        text-align: center;
      }

      /* The book's subject line, still blank: this page doesn't exist. */
      .lost .slot {
        display: inline-block;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.08em;
        color: var(--muted);
        border: 1.5px dashed #c9cfdc;
        border-radius: 9px;
        padding: 6px 16px;
        margin: 8px 0 22px;
      }

      .lost p {
        color: var(--ink-soft);
        margin: 0 auto 28px;
        max-width: 36ch;
      }
    </style>
  </head>
  <body>
    <header class="site-header" data-cta="home"></header>

    <section class="cover lost">
      <div class="wrap">
        <div class="label">
          <span class="slot">404</span>
          <h1 data-i18n="lostTitle">Free period.</h1>
          <p data-i18n="lostText">This page skipped class. It doesn't exist, or it has moved.</p>
          <a class="btn btn-primary" href="/" data-i18n="navBackHome">Back to home</a>
        </div>
      </div>
      <div class="flap"></div>
    </section>

    <footer class="site-footer"></footer>

    <script>
      window.TRANSLATIONS = {
        en: {
          lostTitle: "Free period.",
          lostText: "This page skipped class. It doesn't exist, or it has moved.",
        },
        de: {
          lostTitle: "Freistunde.",
          lostText: "Diese Seite schwänzt. Es gibt sie nicht, oder sie ist umgezogen.",
        },
        fr: {
          lostTitle: "Heure de permanence.",
          lostText: "Cette page sèche les cours. Elle n'existe pas, ou elle a déménagé.",
        },
        es: {
          lostTitle: "Hora libre.",
          lostText: "Esta página se ha saltado la clase. No existe o se ha mudado.",
        },
        zh: {
          lostTitle: "空堂。",
          lostText: "这个页面逃课了。它不存在，或者已经搬走了。",
        },
      };
    </script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/footer.js"></script>
  </body>
</html>
