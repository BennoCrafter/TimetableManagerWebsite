<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script src="assets/js/theme.js"></script>
        <script src="assets/js/i18n.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Feedback - Timetable Manager</title>
        <meta name="description" content="Found a bug or have an idea for Timetable Manager? Send us your feedback or a feature request." />
        <link rel="canonical" href="https://www.timetablemanager.app/feedback" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Timetable Manager" />
        <meta property="og:title" content="Feedback - Timetable Manager" />
        <meta property="og:description" content="Found a bug or have an idea for Timetable Manager? Send us your feedback or a feature request." />
        <meta property="og:url" content="https://www.timetablemanager.app/feedback" />
        <meta property="og:image" content="https://www.timetablemanager.app/assets/images/og/en/card.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="assets/images/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link rel="stylesheet" href="styles.css" />
        <style>
            /* Keep the whole card above the fold on open. */
            .cover.feedback > .wrap {
                padding-top: 16px;
            }

            .cover.feedback .label {
                margin-top: 0;
            }

            .form-intro {
                margin: 0 0 28px;
                color: var(--ink-soft);
            }

            .form-group {
                margin-bottom: 22px;
            }

            label,
            legend {
                display: block;
                padding: 0;
                margin-bottom: 6px;
                font-size: 12px;
                font-weight: 650;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
            }

            input:not([type="radio"]),
            textarea {
                width: 100%;
                padding: 12px 14px;
                border: 1.5px solid #c9cfdc;
                border-radius: 10px;
                font: 400 17px/1.4 var(--font);
                background: #fff;
                color: var(--ink);
                caret-color: #2347b8;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input::placeholder,
            textarea::placeholder {
                color: #6f7488;
            }

            textarea {
                resize: vertical;
            }

            /* Feedback type: three chips, radio buttons underneath. */
            .type-choice {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                border: 0;
                padding: 0;
                min-width: 0;
            }

            .type-choice legend {
                margin-bottom: 6px;
            }

            .type-choice label {
                position: relative;
                margin: 0;
                font-size: 16px;
                font-weight: 500;
                letter-spacing: 0;
                text-transform: none;
                color: var(--ink);
            }

            .type-choice input {
                position: absolute;
                opacity: 0;
                inset: 0;
                margin: 0;
                cursor: pointer;
            }

            .type-choice span {
                display: inline-block;
                padding: 10px 18px;
                border: 1.5px solid #c9cfdc;
                border-radius: 999px;
                background: #fff;
                transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
            }

            .type-choice label:hover span {
                border-color: #9aa3ba;
            }

            .type-choice input:checked + span {
                background: var(--c);
                border-color: var(--c);
                color: #fff;
            }

            .type-choice input:focus-visible + span {
                box-shadow: 0 0 0 3px rgba(35, 71, 184, 0.35);
            }

            input:hover,
            textarea:hover {
                border-color: #9aa3ba;
            }

            input:focus,
            textarea:focus {
                outline: none;
                border-color: #2347b8;
                box-shadow: 0 0 0 3px rgba(35, 71, 184, 0.18);
            }

            .label .btn-primary {
                width: 100%;
                padding: 14px 24px;
                font-size: 16px;
            }

            /* Grayed out until a type is picked and a description written. */
            .label .btn-primary:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }

            .success-message {
                display: none;
            }

            .form-note {
                margin: 14px 0 0;
                font-size: 14px;
                opacity: 0.75;
                text-align: center;
            }

            .success-message p {
                margin-bottom: 24px;
            }

        </style>
    </head>
    <body>
        <header class="site-header" data-cta="home"></header>

        <section class="cover feedback">
          <div class="wrap">
            <div class="label form-container" id="formContainer">
                <h1 data-i18n="title">Share Your Feedback</h1>
                <p class="form-intro" data-i18n="formIntro">Found a bug or have an idea? Let us know.</p>
                <form id="feedbackForm">
                    <fieldset class="form-group type-choice">
                        <legend data-i18n="feedbackType">Feedback Type</legend>
                        <label><input type="radio" name="feedbackType" value="bug" required /><span data-i18n="bug">Bug Report</span></label>
                        <label><input type="radio" name="feedbackType" value="enhancement" /><span data-i18n="enhancement">Feature Request</span></label>
                        <label><input type="radio" name="feedbackType" value="other" /><span data-i18n="other">Other</span></label>
                    </fieldset>

                    <div class="form-group">
                        <label for="description" data-i18n="descriptionLabel"
                            >Description</label
                        >
                        <textarea
                            id="description"
                            data-i18n-placeholder="descriptionPlaceholder"
                            placeholder="Please provide details about your feedback..."
                            required
                            maxlength="2000"
                            rows="6"
                        ></textarea>
                    </div>
                    <!-- Honeypot: hidden from people, filled in by spam bots. -->
                    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden" />

                    <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="submit" disabled>
                        Submit Feedback
                    </button>
                    <p class="form-note" data-i18n="formNote">No name or email needed. Your message and your language are sent to a private Discord channel.</p>
                </form>
            </div>

            <div class="label success-message" id="successMessage">
                <h1 data-i18n="successTitle">Thank You for Your Feedback!</h1>
                <p data-i18n="successMessage">
                    We appreciate your input and will review it shortly.
                </p>
                <button class="btn btn-ghost" id="newFeedbackBtn" data-i18n="newFeedback">Submit Another Feedback</button>
            </div>
          </div>
          <div class="flap"></div>
        </section>

        <footer class="site-footer"></footer>

        <script>
            window.TRANSLATIONS = {
                en: {
                    formNote: "No name or email needed. Your message and your language are sent to a private Discord channel.",
                    errorMessage: "That didn't go through. Please try again in a moment.",
                    formIntro: "Found a bug or have an idea? Let us know.",
                    title: "Share Your Feedback",
                    feedbackType: "Feedback Type",
                    bug: "Bug Report",
                    enhancement: "Feature Request",
                    other: "Other",
                    descriptionLabel: "Description",
                    descriptionPlaceholder: "Please provide details about your feedback...",
                    submit: "Submit Feedback",
                    successTitle: "Thank You for Your Feedback!",
                    successMessage: "We appreciate your input and will review it shortly.",
                    newFeedback: "Submit Another Feedback",
                },
                de: {
                    formNote: "Kein Name und keine E-Mail nötig. Deine Nachricht und deine Sprache werden an einen privaten Discord-Kanal gesendet.",
                    errorMessage: "Das hat gerade nicht geklappt. Versuch es bitte gleich noch einmal.",
                    formIntro: "Hast du einen Fehler gefunden oder eine Idee? Lass es uns wissen.",
                    title: "Teile dein Feedback",
                    feedbackType: "Feedback-Typ",
                    bug: "Fehler",
                    enhancement: "Neue Funktion",
                    other: "Sonstiges",
                    descriptionLabel: "Beschreibung",
                    descriptionPlaceholder: "Bitte gebe Details zu deinem Feedback an...",
                    submit: "Feedback senden",
                    successTitle: "Danke für dein Feedback!",
                    successMessage: "Vielen Dank für dein Feedback!",
                    newFeedback: "Weiteres Feedback senden",
                },
                fr: {
                    formNote: "Ni nom ni e-mail. Ton message et ta langue sont envoyés sur un salon Discord privé.",
                    errorMessage: "L'envoi n'a pas fonctionné. Réessaie dans un instant.",
                    formIntro: "Tu as trouvé un bug ou tu as une idée ? Dis-le-nous.",
                    title: "Donne ton avis",
                    feedbackType: "Type de retour",
                    bug: "Bug",
                    enhancement: "Nouvelle fonction",
                    other: "Autre",
                    descriptionLabel: "Description",
                    descriptionPlaceholder: "Donne-nous des détails sur ton retour...",
                    submit: "Envoyer",
                    successTitle: "Merci pour ton retour !",
                    successMessage: "On va le lire très bientôt.",
                    newFeedback: "Envoyer un autre retour",
                },
                es: {
                    formNote: "Sin nombre ni correo. Tu mensaje y tu idioma se envían a un canal privado de Discord.",
                    errorMessage: "No se pudo enviar. Inténtalo de nuevo en un momento.",
                    formIntro: "¿Has encontrado un error o tienes una idea? Cuéntanoslo.",
                    title: "Danos tu opinión",
                    feedbackType: "Tipo de comentario",
                    bug: "Error",
                    enhancement: "Nueva función",
                    other: "Otro",
                    descriptionLabel: "Descripción",
                    descriptionPlaceholder: "Danos detalles sobre tu comentario...",
                    submit: "Enviar",
                    successTitle: "¡Gracias por tu comentario!",
                    successMessage: "Lo revisaremos muy pronto.",
                    newFeedback: "Enviar otro comentario",
                },
                zh: {
                    formNote: "无需姓名或邮箱。你的留言和语言会发送到一个私密的 Discord 频道。",
                    errorMessage: "提交失败，请稍后再试。",
                    formIntro: "发现了 bug 或有新想法？告诉我们吧。",
                    title: "分享你的反馈",
                    feedbackType: "反馈类型",
                    bug: "Bug 报告",
                    enhancement: "功能建议",
                    other: "其他",
                    descriptionLabel: "描述",
                    descriptionPlaceholder: "请详细描述你的反馈……",
                    submit: "提交反馈",
                    successTitle: "感谢你的反馈！",
                    successMessage: "我们很重视你的意见，会尽快查看。",
                    newFeedback: "再提交一条反馈",
                },
            };
        </script>
        <script src="assets/js/header.js"></script>
        <script src="assets/js/footer.js"></script>

        <script>
            const feedbackForm = document.getElementById("feedbackForm");
            function updateSubmit() {
                document.getElementById("submitBtn").disabled =
                    !feedbackForm.querySelector('input[name="feedbackType"]:checked') ||
                    !document.getElementById("description").value.trim();
            }
            feedbackForm.addEventListener("input", updateSubmit);
            feedbackForm.addEventListener("change", updateSubmit);
            updateSubmit();

            document
                .getElementById("feedbackForm")
                .addEventListener("submit", async function (e) {
                    e.preventDefault();
                    document.getElementById("submitBtn").disabled = true;

                    const form = document.getElementById("feedbackForm");
                    const type = form.querySelector('input[name="feedbackType"]:checked').value;
                    const lang = (document.documentElement.lang || "en").split("-")[0];

                    try {
                        // The shared feedback backend on bennowo.de posts this to Discord (see its README).
                        // Served locally or opened as a file, it goes to the portfolio's dev server (`npm start` there).
                        const local = ["localhost", "127.0.0.1", ""].includes(location.hostname);
                        const endpoint = local ? "http://localhost:3002/api/feedback" : "https://www.bennowo.de/api/feedback";
                        const response = await fetch(endpoint, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                app: "timetable",
                                type: type === "enhancement" ? "idea" : type,
                                message: document.getElementById("description").value,
                                lang,
                                website: form.elements.website.value,
                            }),
                        });

                        if (!response.ok) {
                            throw new Error("Failed to submit feedback");
                        }

                        showSuccessMessage();
                    } catch (error) {
                        console.error("Error:", error);
                        const lang = (document.documentElement.lang || "en").split("-")[0];
                        alert((window.TRANSLATIONS[lang] || window.TRANSLATIONS.en).errorMessage);
                    } finally {
                        updateSubmit();
                    }
                });

            document
                .getElementById("newFeedbackBtn")
                .addEventListener("click", function () {
                    document.getElementById("feedbackForm").reset();
                    updateSubmit();
                    document.getElementById("formContainer").style.display =
                        "block";
                    document.getElementById("successMessage").style.display =
                        "none";
                    scrollToCard("formContainer");
                });

            function showSuccessMessage() {
                document.getElementById("formContainer").style.display = "none";
                document.getElementById("successMessage").style.display =
                    "block";
                scrollToCard("successMessage");
            }

            // The swapped-in card can land off-screen when the user scrolled down to submit.
            function scrollToCard(id) {
                document.getElementById(id).scrollIntoView({
                    block: "center",
                    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
                });
            }
        </script>
    </body>
</html>
